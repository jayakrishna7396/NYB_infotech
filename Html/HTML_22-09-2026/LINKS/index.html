<!DOCTYPE html>
<html>
<head>
    <title>HTML Links</title>
</head>
<body>

    <h1>HTML Links</h1>

    <!-- Anchor Tag
    Used to create a link -->
    <a href="https://www.google.com">Google</a>

    <br><br>

    <!-- Internal Link
    Opens another page in our project -->
    <a href="about.html">About Page</a>

    <br><br>

    <!-- External Link
    Opens another website -->
    <a href="https://www.youtube.com">YouTube</a>

    <br><br>

    <!-- Email Link
    Opens email application -->
    <a href="mailto:madicharlajayakrishna@gmail.com">Send Email</a>

    <br><br>

    <!-- Telephone Link
    Used to call a phone number -->
    <a href="tel:+917396447980">Call Us</a>

    <br><br>

    <!-- New Tab
    target="_blank" opens the link in a new tab -->
    <a href="https://www.google.com" target="_blank">
        Open Google in New Tab
    </a>

</body>
</html>
