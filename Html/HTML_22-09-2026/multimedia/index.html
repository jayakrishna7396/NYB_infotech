<!DOCTYPE html>
<html>
<head>
    <title>Working Video Example</title>
</head>
<body>

    <h1>HTML Video</h1>

    <video width="500" controls>
        <source
            src="https://www.w3schools.com/html/mov_bbb.mp4"
            type="video/mp4"
        >
        Your browser does not support video.
    </video>

    <h1>Autoplay</h1>

    <video width="500" controls autoplay muted>
        <source
            src="https://www.w3schools.com/html/mov_bbb.mp4"
            type="video/mp4"
        >
    </video>

    <h1>Loop</h1>

    <video width="500" controls loop>
        <source
            src="https://www.w3schools.com/html/mov_bbb.mp4"
            type="video/mp4"
        >
    </video>

    <h1>Muted</h1>

    <video width="500" controls muted>
        <source
            src="https://www.w3schools.com/html/mov_bbb.mp4"
            type="video/mp4"
        >
    </video>

</body>
</html>
