<!DOCTYPE html>
<html>
<head>

    <!-- Favicon
    Small icon shown in the browser tab -->
    <link rel="icon" href="https://www.bing.com/th/id/OIP.Pu4NzIdjw2Jro4BLXai_UwHaHa?w=121&h=128&c=8&rs=1&qlt=90&r=0&o=6&pid=ImgAns&rm=2">

    <title>Images</title>
</head>

<body>

    <h1>HTML Images</h1>

    <!-- Image Tag
    Used to display an image -->
    <img src="https://th.bing.com/th/id/OIP.tmAHwgyjodtaZY7KvzP_kwHaEK?w=258&h=182&c=7&r=0&o=7&pid=1.7&rm=3">

    <br><br>

    <!-- src
    Tells the browser where the image is located -->
    <img src="https://static.vecteezy.com/system/resources/previews/028/627/212/large_2x/photorealistic-panoramic-view-of-the-beautiful-natural-landscape-on-the-edge-of-the-lake-in-the-forest-created-with-ai-generative-free-photo.jpg" width="300px" height="200px>

    <br><br>

    <!-- Width and Height
    Used to set the image size -->
    <img src="image.jpg" alt="Nature Image" width="300" height="200">

    <br><br>

    <!-- Image Link
    Clicking the image opens the link -->
    <a href="https://www.google.com">
        <img src="image.jpg" alt="Google" width="200">
    </a>

    //anchor tag
    href=""
</body>
</html>
