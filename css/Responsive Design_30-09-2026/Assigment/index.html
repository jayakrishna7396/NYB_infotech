<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive CSS Assignment</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Responsive Website</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main>

        <h2>Responsive Cards</h2>

        <section class="cards">

            <div class="card">
                <h3>Card 1</h3>
                <p>Responsive design for different screens.</p>
                <button>Hover Me</button>
            </div>

            <div class="card">
                <h3>Card 2</h3>
                <p>CSS transforms and transitions.</p>
                <button>Hover Me</button>
            </div>

            <div class="card">
                <h3>Card 3</h3>
                <p>Animations using keyframes.</p>
                <button>Hover Me</button>
            </div>

        </section>

        <!-- Animation -->
        <h2>CSS Animation</h2>

        <div class="animation-box">
            Moving Box
        </div>

        <!-- Positioning and Z-Index -->
        <h2>Positioning and Z-Index</h2>

        <div class="position-container">
            <div class="box box-one">Box 1</div>
            <div class="box box-two">Box 2</div>
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 Responsive Website</p>
    </footer>

</body>
</html>
