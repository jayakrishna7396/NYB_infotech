<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attribute Selectors</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="./index.css">
</head>

<body>

    <h1>CSS Attribute Selectors</h1>

    <p>Attribute selectors select HTML elements based on their attributes.</p>


    <h2>1. Select by Attribute Value</h2>

    <input type="text" placeholder="Enter Name">

    <input type="email" placeholder="Enter Email">

    <input type="password" placeholder="Enter Password">


    <h2>2. Select Required Elements</h2>

    <input type="text" placeholder="Username" required>

    <input type="email" placeholder="Email" required>

    <input type="text" placeholder="Optional">


    <h2>3. Select Links by Target</h2>

    <a href="https://www.google.com" target="_blank">
        Google
    </a>

    <br><br>

    <a href="https://www.example.com">
        Example
    </a>


    <h2>4. Select Elements with Class Attribute</h2>

    <p class="important">Important Paragraph</p>

    <p class="normal">Normal Paragraph</p>


</body>
</html>
