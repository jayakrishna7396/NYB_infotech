<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pseudo Classes</title>

    <link rel="stylesheet" href="./index.css">
</head>

<body>

    <h1>Pseudo-Classes</h1>


    <!-- :hover -->

    <h2>1. :hover</h2>

    <button class="hover-button">
        Move Mouse Over Me
    </button>


    <!-- :focus -->

    <h2>2. :focus</h2>

    <input
        type="text"
        placeholder="Click inside this input"
    >


    <!-- :active -->

    <h2>3. :active</h2>

    <button class="active-button">
        Click and Hold Me
    </button>


    <!-- :visited -->

    <h2>4. :visited</h2>

    <a
        href="https://www.youtube.com/"
        target="_blank"
    >
        Visit Google
    </a>


    <!-- :first-child -->

    <h2>5. :first-child</h2>

    <ul class="first-list">
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
    </ul>


    <!-- :last-child -->

    <h2>6. :last-child</h2>

    <ul class="last-list">
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
    </ul>


    <!-- :nth-child() -->

    <h2>7. :nth-child()</h2>

    <ul class="nth-list">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
    </ul>

</body>
</html>
