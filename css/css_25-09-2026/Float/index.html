
<!DOCTYPE html>
<html>
<head>
    <title>CSS Float and Clear</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS Float</h1>

    <h2>Float</h2>

    <div class="float-box">
        Float
    </div>

    <p>
        Float moves an element to the left or right
        and allows other content to flow around it.
    </p>

    <h2>Clear</h2>

    <div class="clear-box">
        Clear
    </div>

    <p class="clear-text">
        Clear prevents an element from moving next to
        a floated element.
    </p>

</body>
</html>
