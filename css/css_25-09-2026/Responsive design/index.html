<!DOCTYPE html>
<html>
<head>
    <title>Responsive Design</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Responsive Design</h1>

    <!-- Media Queries -->
    <h2>Media Queries</h2>
    <p class="media-text">
        Resize the browser window to see the change.
    </p>

    <!-- Mobile-first Design -->
    <h2>Mobile-first Design</h2>
    <div class="mobile-box">
        Mobile-first design
    </div>

    <!-- Breakpoints -->
    <h2>Breakpoints</h2>
    <p class="breakpoint">
        This text changes at different screen sizes.
    </p>

    <!-- Responsive Images -->
    <h2>Responsive Images</h2>
    <img
        class="responsive-image"
        src="https://picsum.photos/800/400"
        alt="Responsive Example"
    >

    <!-- Responsive Layout -->
    <h2>Responsive Layout</h2>
    <div class="layout">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
    </div>

</body>
</html>
