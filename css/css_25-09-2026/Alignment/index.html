<!DOCTYPE html>
<html>
<head>
    <title>CSS Alignment</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS Alignment</h1>

    <!-- Horizontal Alignment -->
    <h2>Horizontal Alignment</h2>
    <div class="horizontal">
        Horizontal Center
    </div>

    <!-- Vertical Alignment -->
    <h2>Vertical Alignment</h2>
    <div class="vertical">
        Vertical Center
    </div>

    <!-- Flex Alignment -->
    <h2>Flex Alignment</h2>
    <div class="flex">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
    </div>

    <!-- Grid Alignment -->
    <h2>Grid Alignment</h2>
    <div class="grid">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
        <div>Box 4</div>
    </div>

</body>
</html>
