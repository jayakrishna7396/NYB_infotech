<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS Grid</h1>

    <!-- Grid Container -->
    <h2>Grid Container</h2>
    <div class="container">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
        <div>Box 4</div>
    </div>

    <!-- Grid Columns and Rows -->
    <h2>Grid Columns and Rows</h2>
    <div class="columns-rows">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>

    <!-- Gap -->
    <h2>Gap</h2>
    <div class="gap">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
        <div>Box 4</div>
    </div>

    <!-- Grid Areas -->
    <h2>Grid Areas</h2>
    <div class="areas">
        <header>Header</header>
        <nav>Navigation</nav>
        <main>Main Content</main>
        <footer>Footer</footer>
    </div>

    <!-- fr Unit -->
    <h2>fr Unit</h2>
    <div class="fr-example">
        <div>1fr</div>
        <div>2fr</div>
    </div>

    <!-- repeat() -->
    <h2>repeat()</h2>
    <div class="repeat-example">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
    </div>

    <!-- minmax() -->
    <h2>minmax()</h2>
    <div class="minmax-example">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
    </div>

</body>
</html>
