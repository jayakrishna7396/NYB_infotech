<!DOCTYPE html>
<html>
<head>
    <title>DOM Practice</title>
</head>
<body>

    <h1 id="title">DOM Practice</h1>

    <!-- Dynamic List -->
    <h2>Dynamic List</h2>

    <input type="text" id="itemInput" placeholder="Enter item">
    <button id="addBtn">Add Item</button>

    <ul id="itemList"></ul>

    <!-- Input Event -->
    <h2>Input Event</h2>

    <input type="text" id="nameInput" placeholder="Type your name">
    <p id="nameMessage"></p>

    <!-- Change Event -->
    <h2>Change Event</h2>

    <select id="course">
        <option value="">Select Course</option>
        <option value="JavaScript">JavaScript</option>
        <option value="React">React</option>
        <option value="HTML">HTML</option>
    </select>

    <!-- Submit Event -->
    <h2>Submit Event</h2>

    <form id="userForm">
        <input type="text" id="username" placeholder="Enter username">
        <button type="submit">Submit</button>
    </form>

    <!-- Mouse Event -->
    <h2>Mouse Event</h2>

    <div id="mouseBox">
        Move Mouse Here
    </div>

    <!-- Keyboard Event -->
    <h2>Keyboard Event</h2>

    <input type="text" id="keyInput" placeholder="Press a key">

    <!-- Bubbling and Capturing -->
    <h2>Event Bubbling and Capturing</h2>

    <div id="parent">
        Parent
        <button id="child">Child Button</button>
    </div>

    <!-- Throttling -->
    <h2>Throttling</h2>

    <div id="throttleBox">
        Move mouse here
    </div>

    <!-- Debouncing -->
    <h2>Debouncing</h2>

    <input type="text" id="searchInput" placeholder="Search...">

    <!-- Storage -->
    <h2>Local Storage</h2>

    <button id="saveBtn">Save Student</button>
    <button id="getBtn">Get Student</button>

    <h2>Session Storage</h2>

    <button id="sessionBtn">Save Session Data</button>

    <script src="index.js"></script>

</body>
</html>
